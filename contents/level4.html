<!DOCTYPE html><html><head><title>崩溃</title><link rel="stylesheet" href="../assets/css/default.css"></head><body><div class="article-body" data-yacho-content="level4" data-yacho-format="html"><!-- ========================================== -->
<!-- ARG 仪式召唤页面 - 打字机压迫版（死寂停顿版）START -->
<!-- ========================================== -->

<style>
    /* 重置基础样式 */
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background-color: #050000; /* 极深暗红/黑 */
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
    }

    /* 中央全屏容器 */
    #ceremony-container {
        width: 100vw; height: 100vh;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        padding: 40px; box-sizing: border-box;
        overflow-y: auto; 
        transition: all 0.5s ease;
        scrollbar-width: none;
        -ms-overflow-style: none;
    }
    #ceremony-container::-webkit-scrollbar { display: none; }

    /* 文本显示区域 */
    #typewriter {
        color: #cc0000;
        font-size: 30px;
        line-height: 1.8;
        white-space: pre-wrap;
        word-break: break-all;
        max-width: 90%; width: 100%;
        text-align: center;
        text-shadow: 0 0 8px rgba(204, 0, 0, 0.6);
    }

    /* 打字机光标 */
    .cursor {
        display: inline-block;
        width: 12px; height: 30px;
        background-color: #cc0000;
        animation: blink 0.8s infinite;
        vertical-align: middle;
        margin-left: 4px;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* 颤抖效果 */
    .shaking { animation: shake 0.1s infinite; }
    @keyframes shake {
        0% { transform: translate(0px, 0px); }
        25% { transform: translate(1px, 0px); }
        50% { transform: translate(0px, 1px); }
        75% { transform: translate(-1px, 0px); }
        100% { transform: translate(0px, 0px); }
    }

    /* “是” 按钮样式 */
    #choice-btn {
        display: none;
        margin-top: 60px;
        padding: 15px 50px;
        font-size: 22px;
        color: #cc0000;
        background-color: transparent;
        border: 2px solid #cc0000;
        border-radius: 4px;
        cursor: pointer;
        font-family: "Courier New", Courier, monospace;
        font-weight: bold;
        letter-spacing: 5px;
        transition: all 0.3s ease;
        opacity: 0;
        flex-shrink: 0;
    }
    #choice-btn.show { display: inline-block; animation: fadeIn 1s forwards; }
    #choice-btn:hover {
        background-color: #cc0000; color: #000000;
        box-shadow: 0 0 20px rgba(204, 0, 0, 0.8);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ================= 404 错误页面样式 ================= */
    #error-page {
        display: none;
        width: 100vw; height: 100vh;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: #333; flex-direction: column;
        justify-content: center; align-items: center;
        position: fixed; top: 0; left: 0; z-index: 99999;
    }
    .browser-bar {
        position: absolute; top: 0; left: 0; width: 100%; height: 50px;
        background-color: #f1f3f4; border-bottom: 1px solid #e0e0e0;
        display: flex; align-items: center; padding: 0 20px; box-sizing: border-box;
        font-size: 14px; color: #555;
    }
    .browser-bar .url-box {
        background: #fff; border: 1px solid #ddd; border-radius: 20px;
        padding: 5px 15px; width: 60%; display: flex; align-items: center; margin-left: 20px;
    }
    .browser-bar .url-box::before {
        content: "⚠️"; margin-right: 8px; font-size: 12px;
    }
    .error-content {
        text-align: left; max-width: 600px; padding: 20px;
    }
    .error-content h1 {
        font-size: 24px; font-weight: 500; margin-bottom: 10px; color: #202124;
    }
    .error-content p {
        font-size: 15px; line-height: 1.6; color: #5f6368; margin-bottom: 20px;
    }
    .error-content .code {
        font-size: 13px; color: #999; margin-top: 30px; font-family: monospace;
    }
</style>

<!-- 中央容器 -->
<div id="ceremony-container">
    <div id="typewriter"></div>
    <button id="choice-btn" onclick="showErrorPage()">是</button>
</div>

<!-- ================= 404 错误页面（默认隐藏） ================= -->
<div id="error-page">
    <div class="browser-bar">
        <div class="url-box">http://<a href="level5.html" target="_blank"><strong style="font-weight: 600;">sphinxterich</strong></a>-official-forum.org</div>
    </div>
    
    <div class="error-content">
        <h1>无法访问此网站</h1>
        <p>找不到 <strong>sephanterich-official-forum.org</strong> 的网页。<br>
        该网站可能已崩溃，或者网址可能拼写错误。</p>
        <div class="code">ERR_FILE_NOT_FOUND</div>
    </div>
</div>

<script>
    // ========== 核心文本内容 ==========
    const textPart1 = `赞美斯芬特里奇
祂是我们的主
祂将取回属于祂的一切
人们都将回想起祂的名字
我们在祂的慈怀下起舞
我们无比欢乐
我们无比愉悦
每一只手都是我们自己的手
每一双眼都是我们自己的眼
与祂融为一体`;
    
    const repeatText = `与祂融为一体`;

    const tw = document.getElementById('typewriter');
    const btn = document.getElementById('choice-btn');
    const container = document.getElementById('ceremony-container');

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    // 打字机效果
    function typeText(element, text, speed) {
        return new Promise(resolve => {
            let i = 0;
            element.innerHTML = '';
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    element.innerHTML = element.innerHTML.replace('<span class="cursor"></span>', '') + '<span class="cursor"></span>';
                    setTimeout(type, speed);
                } else {
                    element.innerHTML = element.innerHTML.replace('<span class="cursor"></span>', '');
                    resolve();
                }
            }
            type();
        });
    }

    // 擦除效果
    function eraseText(element, speed) {
        return new Promise(resolve => {
            function erase() {
                let currentText = element.innerHTML;
                currentText = currentText.replace('<span class="cursor"></span>', '');
                if (currentText.length > 0) {
                    currentText = currentText.substring(0, currentText.length - 1);
                    element.innerHTML = currentText + '<span class="cursor"></span>';
                    container.scrollTop = container.scrollHeight;
                    setTimeout(erase, speed);
                } else {
                    element.innerHTML = '';
                    resolve();
                }
            }
            erase();
        });
    }

    // ========== 主流程控制 ==========
    async function runCeremony() {
        // 1. 逐字显示第一部分
        await typeText(tw, textPart1, 40);
        await sleep(300); 

        container.style.justifyContent = 'flex-start';
        tw.style.marginTop = '20px';

        // 2. 疯狂铺满屏幕
        await new Promise(resolve => {
            let count = 0;
            let interval = setInterval(() => {
                tw.innerHTML += repeatText;
                count++;
                container.scrollTop = container.scrollHeight;

                if (count > 1000 || tw.scrollHeight > window.innerHeight * 2) {
                    clearInterval(interval);
                    resolve();
                }
            }, 10); 
        });

        // 3. 全部显示完后，等待 3 秒
        await sleep(3000);

        // 4. 文字像被删除那样瞬间消失（速度 2ms）
        await eraseText(tw, 2); 
        
        // 5. 擦除完毕后，重置滚动位置到顶部
        container.scrollTop = 0;
        container.style.justifyContent = 'center'; 
        tw.style.marginTop = '0';

        // 🚨 6. 新增：加长死寂停顿时间（这里改为 2500 毫秒，即 2.5 秒）
        await sleep(2500); 
        
        // 7. 开始颤抖，并显示“你在看吗”
        tw.classList.add('shaking');
        await typeText(tw, "你在看吗", 250);
        tw.classList.remove('shaking');

        await sleep(1000);
        btn.classList.add('show');
    }

    // ========== 切换到 404 错误页面 ==========
    function showErrorPage() {
        document.getElementById('ceremony-container').style.display = 'none';
        document.getElementById('error-page').style.display = 'flex';
        document.body.style.overflow = 'auto';
    }

    // 启动流程
    runCeremony();
</script>
<!-- ========================================== -->
<!-- ARG 仪式召唤页面 - 打字机压迫版（死寂停顿版）END -->
<!-- ========================================== --></div></body></html>
